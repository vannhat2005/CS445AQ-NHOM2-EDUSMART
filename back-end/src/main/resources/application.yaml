spring:
  application:
    name: back-end

  datasource:
    url: jdbc:mysql://localhost:3306/edusmart_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true

  # Cấu hình upload video và PDF
  servlet:
    multipart:
      enabled: true
      max-file-size: 200MB
      max-request-size: 210MB

# Thư mục lưu video và PDF của bài học
app:
  upload-dir: uploads/lesson-contents
server:
  port: 8080