
spring:
  application:
    name: back-end

  # ==========================================
  # 1. MYSQL DATABASE
  # ==========================================
  datasource:
    url: jdbc:mysql://localhost:3306/edusmart_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ==========================================
  # 2. JPA / HIBERNATE
  # ==========================================
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true

  # ==========================================
  # 3. UPLOAD VIDEO / PDF
  # ==========================================
  servlet:
    multipart:
      enabled: true
      max-file-size: 200MB
      max-request-size: 210MB

  # ==========================================
  # 4. SANDBOX PROFILE
  # ==========================================
  profiles:
    active: sandbox

# ==========================================
# 5. APP CONFIGURATION
# ==========================================
app:
  upload-dir: uploads/lesson-contents
  upload:
    images-dir: uploads/images
    videos-dir: uploads/videos

  jwt:
    secret: "RGyivbOAwSDYdNNTwhf0xX4COpkPyslqWMmB1cgB47t"
    expiration-ms: 900000
    refresh-expiration-ms: 604800000

  cookie:
    secure: false
    same-site: Lax

