
spring:
  application:
    name: back-end

  # ==========================================
  # 1. MYSQL DATABASE
  # ==========================================
  datasource:
    url: jdbc:mysql://localhost:3306/edusmart_db
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ==========================================
  # 2. JPA / HIBERNATE
  # ==========================================
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true

  # ==========================================
  # 3. UPLOAD VIDEO / PDF
  # ==========================================
  servlet:
    multipart:
      enabled: true
      max-file-size: 200MB
      max-request-size: 210MB

  # ==========================================
  # 4. SANDBOX PROFILE
  # ==========================================
  profiles:
    active: sandbox

  # ==========================================
  # KAFKA BROKER
  # ==========================================
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: edusmart-ai-rag-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  # ==========================================
  # 5. EMAIL OTP
  # ==========================================
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# ==========================================
# APP CONFIGURATION
# ==========================================
app:
  upload-dir: uploads/lesson-contents
  upload:
    images-dir: uploads/images
    videos-dir: uploads/videos
    avatar-dir: uploads/avatars

  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 900000
    refresh-expiration-ms: 604800000

  password-reset:
    secret: ${PASSWORD_RESET_SECRET}

  cookie:
    secure: false
    same-site: Lax

# ==========================================
# 6. SERVER
# ==========================================
server:
  port: 8080
  address: 0.0.0.0

# ==========================================
# 7. ZALOPAY SANDBOX
# ==========================================
zalopay:
  app-id: ${ZALOPAY_APP_ID:553}
  key1: ${ZALOPAY_KEY1}
  key2: ${ZALOPAY_KEY2}

  create-url: https://sb-openapi.zalopay.vn/v2/create
  query-url: https://sb-openapi.zalopay.vn/v2/query

  callback-url: ""
  redirect-url: http://localhost:5173/student/payment/result

# ==========================================
# 8. MOMO SANDBOX
# ==========================================
momo:
  partner-code: ${MOMO_PARTNER_CODE:MOMO}
  access-key: ${MOMO_ACCESS_KEY}
  secret-key: ${MOMO_SECRET_KEY}

  create-url: https://test-payment.momo.vn/v2/gateway/api/create
  query-url: https://test-payment.momo.vn/v2/gateway/api/query

  redirect-url: http://localhost:5173/student/payment/result

  ipn-url: ${MOMO_IPN_URL:https://xxxx.ngrok-free.app/api/payments/momo/ipn}

# ==========================================
# 9. AI CHATBOX & RAG CONFIGURATION
# ==========================================
ai:
  llm:
    provider: "gemini"
    api-key: ${GEMINI_API_KEY:}
    model-name: ${GEMINI_MODEL_NAME:}
    temperature: 0.3
    max-tokens: 4096

  embeddings:
    provider: "local"
    model-name: "models/gemini-embedding-001"
    dimension: 768

  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017}
    database: "edusmart_ai_db"
    collection: "lesson_pdf_embeddings"
    timeout-ms: 3000

  rag:
    chunk-size: 600
    chunk-overlap: 100
    top-k: 4
    upload-dir: "uploads/lesson-contents"

  kafka:
    enabled: true
    topic: "lesson-pdf-topic"
